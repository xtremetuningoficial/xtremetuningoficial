name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # El build no necesita las variables de Supabase: sin ellas solo avisa en consola.
      - run: npm run build
